name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the Cargo.toml version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" below/Cargo.toml

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      upload: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/below-*
            dist/**/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
